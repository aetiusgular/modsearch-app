[package]
name = "modsearch-engine"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
description = "ModSearch headless on-device engine service. Framed native messaging; deterministic replayable serving (A28-A31); SQLite persistence (A10); ported scoring/episodes/dual-window taste and fused MMR ranking (A11/A13) over a synthetic encoder behind the A12 ONNX seam."

[[bin]]
name = "modsearch-engine"
path = "src/main.rs"

[features]
# A12: the real ONNX image encoder. OFF by default so the standard build and CI
# carry zero extra deps and no native ONNX Runtime. Enable with
# `--features onnx` (validated on macOS/Windows where CoreML/DirectML apply).
onnx = ["dep:ort", "dep:image"]
# A16: real-boutique ingest. Implies onnx (it embeds photos) and adds a blocking
# HTTP client for the products.json + image fetch. Opt-in so the default/CI
# build stays network-free; the fetch only ever runs on a user's machine.
ingest = ["onnx", "dep:ureq"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
# A10: bundled SQLite (no system dep). DuckDB deliberately deferred: at current
# volumes SQLite covers the analytics reads behind the AnalyticsStore seam.
rusqlite = { version = "0.32", features = ["bundled"] }
# A12 (opt-in): ONNX Runtime via load-dynamic (libonnxruntime resolved at
# runtime, not linked at build); CoreML+DirectML EP structs compile on every OS
# and are cfg-selected at call time. `image` decodes + resizes garment photos.
ort = { version = "2.0.0-rc.13", default-features = false, features = ["load-dynamic", "coreml", "directml", "ndarray"], optional = true }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"], optional = true }
# A16 (opt-in, via the `ingest` feature): blocking HTTP for products.json + image
# fetch. rustls + bundled Mozilla roots (webpki-roots) so there is no OpenSSL or
# system-cert dependency. gzip for Shopify's compressed catalog responses.
ureq = { version = "2", optional = true }

